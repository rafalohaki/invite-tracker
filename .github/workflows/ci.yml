name: CI

on:
    push:
        branches: [MAIN]
    pull_request:
        branches: [MAIN]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.x
            - uses: actions/cache@v4
              with:
                  path: node_modules
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
            - run: bun install --frozen-lockfile
            - run: bun run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.x
            - uses: actions/cache@v4
              with:
                  path: node_modules
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
            - run: bun install --frozen-lockfile
            - run: bun run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.x
            - uses: actions/cache@v4
              with:
                  path: node_modules
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
            - run: bun install --frozen-lockfile
            - run: bun test

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.x
            - uses: actions/cache@v4
              with:
                  path: node_modules
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
            - run: bun install --frozen-lockfile
            - run: bun audit --prod
